schema_version: "1.0"
name: fast-widening-batch
description: The ticket is reported at its done line, a pre-existing failure becomes a separate blocker, and widened cleanup lands as one batch.
tags: [speed, verification]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
  prompt: |
    /xstack:poteto-mode apply_discount in pricing.py returns a total above the original for a negative percent and below zero for a percent over 100. Clamp percent to 0..100. Widening is fine, clean up anything else you find, but keep it fast.
graders:
  - type: regex
    name: ticket-clamps-percent
    target: { source: file, path: pricing.py }
    pattern: 'min\(|max\(|clamp'
  - type: regex
    name: negative-percent-tested
    target: { source: file, path: tests/test_pricing.py }
    pattern: 'apply_discount\(\s*\d+\s*,\s*-\d+\s*\)'
  - type: tool_used
    name: preflight-checks-tools
    tool: Bash
    input_match: "command -v"
    min: 1
  - type: tool_used
    name: baseline-through-worker-init
    tool: Bash
    input_match: "worker init .*--check .*(unittest|pytest)"
    min: 1
  - type: llm
    name: baseline-red-is-separate-blocker
    criteria: The final reply says test_report.py (monthly_label December) was already failing before the change and records it as a separate blocker or a separately fixed widening item, not as part of the discount ticket.
  - type: llm
    name: ticket-reported-before-batch
    criteria: The final reply reports the discount ticket as done at its done line (its own tests green, no new failure versus the baseline) and lists the widening work (the report.py month table, the TODO comment) as a separate batch that was fixed, deferred, or ticketed.
  - type: llm
    name: one-verification-round-for-batch
    criteria: The transcript shows the widening fixes applied together and verified in one round, not a formatter, review, and test cycle repeated after each individual cleanup edit.
