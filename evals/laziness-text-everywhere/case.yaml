schema_version: "1.0"
name: laziness-text-everywhere
description: A text change fixes every place the old statement appears, not only the intro.
tags: [laziness]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
  prompt: |
    /xstack:principle-laziness-protocol tidy now also runs on Windows and macOS. Update the README intro to say so. Keep the change small and tell me what you changed.
graders:
  - type: regex
    name: no-linux-only-left
    target: {source: file, path: README.md}
    pattern: "Linux only|Only if it runs Linux"
    flags: i
    match: not_contains
  - type: regex
    name: intro-names-windows
    target: {source: file, path: README.md}
    pattern: "Windows"
  - type: llm
    name: report-explains-scope
    criteria: The final reply says it also fixed the other places that still said Linux only (install and FAQ), or explains clearly why each was left; a reply that changed only the intro and calls the job done fails.
  - type: tool_used
    name: swept-with-subtask
    tool: Bash
    input_match: "subtask .*--grep|--grep .*subtask|--grep .*--keep-going|--keep-going .*--grep"
    min: 1
  - type: regex
    name: pairs-prove-it-works
    target: last_message
    pattern: "prove it works"
    flags: i
  - type: regex
    name: names-a-partner-principle
    target: last_message
    pattern: "fix root causes|test behavior|subtract before you add|minimize reader load|redesign from first principles|model the domain|sequence work|verifiable units|experience first"
    flags: i
