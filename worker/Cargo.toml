[package]
name = "xstack-worker"
version = "0.2.0"
edition = "2021"
publish = false
description = "Verifies commits in background jobs, with concurrency based on available CPU and memory."

[lib]
name = "xstack_worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
