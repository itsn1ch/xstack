[package]
name = "xstack-worker"
version = "0.2.0"
edition = "2021"
publish = false
description = "Verifies commits in background jobs, with concurrency based on available CPU and memory."

[lib]
name = "xstack_worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
